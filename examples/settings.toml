# Annotated RespMech settings file.
#
# A realistic starting point covering the common keys, with comments explaining each
# block and the current schema default alongside anything overridden. Kept in sync
# with the annotated example in documentation.html's "The settings file (TOML)"
# section on respmech.dk — update both together.
#
# Unlike the copy on the website, this file is directly runnable: input.folder /
# input.files point at sample_recording.csv, the same small synthetic recording the
# desktop app's "Explore with sample data" generates (respmech.core.sample —
# deterministic, no patient data). From the repository root:
#
#     respmech validate examples/settings.toml
#     respmech run      examples/settings.toml --dry-run
#
# For your own recordings: copy this file next to them, then edit [input] and
# [input.channels] to match your export and re-run `respmech validate` before
# anything else.

schema_version = 2

[input]
folder = "input"                  # recordings to analyse; relative → resolved against THIS file's folder
files  = "sample_recording.csv"   # case-insensitive glob; may carry a subfolder, e.g. "raw/*.csv"

[input.format]
sampling_frequency = 1000   # Hz — REQUIRED, integer; every time window is derived from this
matlab_variant     = "mac"  # "windows" | "mac"; only affects .mat inputs
decimal            = "."    # use "," for European-locale text/CSV

[input.channels]            # 1-based column numbers (LabChart convention);
                            # column 1 is the time axis, so signals start at 2
flow    = 5                 # REQUIRED
volume  = 6                 # REQUIRED unless processing.volume.integrate_from_flow = true
poes    = 7                 # optional — omit to leave its columns out; adds work of breathing
pgas    = 8                 # optional — omit to leave its columns out; adds gastric pressure
pdi     = 9                 # optional — omit to leave its columns out; adds transdiaphragmatic pressure
emg     = [2, 3, 4]         # EMG channels; [] disables all EMG processing
entropy = [2, 3, 4]         # sample-entropy channels; [] disables entropy

[processing.segmentation]
method = "flow"             # "flow" | "volume" — which signal detects breath boundaries
buffer = 800                # samples averaged for cycle detection (scale with fs)

[processing.segmentation.peak]
height     = 0.1            # min peak height, in the segmentation signal's units
distance_s = 0.1            # s — min time between peaks
width_s    = 0.5            # s — min peak width

[processing.volume]
integrate_from_flow = false # true → derive volume from flow (volume channel becomes optional)
correct_drift       = true  # remove slow baseline drift (ON by default)
correct_trend       = false # also remove a between-breath trend in end-expiratory volume
trend_method        = "linear"  # scipy interp1d kind for the trend envelope
trend_peak_min_prominence_frac = 0.05  # trough depth to anchor on, as a fraction of
                                       # THIS recording's volume range (scale-free)
trend_peak_min_distance_s      = 0.4   # s — min time between two anchors
# trend_peak_min_height        = 0.8   # legacy ABSOLUTE depth below the recording's
                                       # highest volume. Omit it (recommended): a fixed
                                       # value larger than the volume range finds no
                                       # troughs and the correction cannot run.

[processing.wob]
calc_from          = "average"  # "average" (classic Campbell) | "individual" (per breath)
avg_resampling_obs = 500        # samples each phase is resampled to for P/V averaging (~ fs ÷ 8-10)

[processing.emg]
rms_window_s   = 0.050          # s — sliding RMS window (effective length fs·rms_window_s - 1 samples, trailing, not centred)
remove_ecg     = false          # subtract cardiac contamination before RMS
detect_channel = 0              # 0-based INDEX into the emg list above (not a column number)
normalization  = "per_file_max" # "none" | "per_file_max" | "per_file_mean" (adds a normalised sheet)

[processing.emg.noise]
enabled = false                 # spectral STFT noise reduction; needs the [emg] extra (librosa)

[processing.ptp]
baseline_window_s = 0.05        # s — window whose mean is the pressure-time-product baseline

# --- Per-file overrides (zero or more of each); illustrative, none applied here ---
# [[processing.exclude_breaths]]
# file    = "sample_recording.csv"
# breaths = [1, 2]                # 1-based breath numbers; always dropped from averages/workbooks
#
# [[processing.breath_counts]]
# file  = "sample_recording.csv"
# count = 12                      # override the auto-detected breath count for this file

# --- Signal set: which signals the analysis uses (optional) ---
# Leave the table out and the set is derived from the channels assigned above, which is
# what every analysis written before signal sets existed does. Name one explicitly to
# declare a set: any of "flow", "poes", "pgas", "pdi", "emg". An assigned
# channel that is not named is added on load, with a notice.
# [analysis]
# signals = ["flow", "poes", "pgas", "pdi", "emg"]   # must cover every assigned channel

# --- Breath types: name a breath as a manoeuvre instead of tidal breathing ---
# Breath numbers are the ones `respmech breaths settings.toml` prints and Preview & QC
# shows. A typed breath is left out of the tidal averages, like an excluded one, and is
# measured in the Manoeuvres table instead. Kinds: "ic" (inspiratory capacity), "fvc"
# (forced vital capacity), "ic_fvc" (both in one breath), "max_insp" (maximal
# inspiratory effort), "sniff", "rest" (an EMG-only noise reference) and "other".
# [[processing.breath_types]]
# file  = "sample_recording.csv"
# breath = 6                      # 1-based, in this file
# kind  = "ic"
# label = "IC after warm-up"      # optional free text kept with the entry

# --- Reference manoeuvres: where a file's IC / FVC / baseline / maximal effort come from ---
# A reference is one or more typed breaths, in this file or in another one. The order is
# always: an entry for the file, then the entry for its group, then the file's own typed
# breath. An unresolved link gives blank values and a caution, never an error (unless
# processing.lung_volume.require_references is true).
# [[processing.references]]
# file = "P03_peak.csv"
# ic = { file = "P03_IC.csv", breaths = [2, 3, 4] }       # several repeats are combined
# fvc = { file = "P03_MFVL.csv", breaths = [1] }
# baseline_ic = { file = "P03_rest.csv", breaths = [7] }  # a different recording by nature
# max_insp = { file = "P03_max.csv", breaths = [1] }   # a breath can be typed only once

# Or once per participant: the group is the key the cohort summary uses (the leading
# filename token, or output.group_regex).
# [[processing.reference_defaults]]
# group = "P03"
# ic = { file = "P03_IC.csv", breaths = [2, 3, 4] }

# --- Subjects: per-participant spirometry, applied to every file of that group ---
# vc_l anchors the operating lung volumes above residual volume; tlc_l adds the absolute
# values; fev1_l (preferred over a value derived from a typed FVC breath) feeds the MVV
# estimate, mvv_lpm overrides it; both feed the breathing-reserve columns. sex, age_years and
# height_cm are optional and used only to draw the normal flow-volume range (GLI 2022) behind
# the maximal flow-volume loop; all three are needed, or nothing is drawn.
# [[input.subjects]]
# key     = "P03"
# tlc_l   = 6.12
# vc_l    = 4.30
# rv_l    = 1.90
# fev1_l  = 3.10
# mvv_lpm = 124.0
# sex        = "male"        # "male" or "female"
# age_years  = 41.0
# height_cm  = 180.0

# --- Operating lung volumes, flow-volume placement, PEEPi, normalisation (all optional) ---
# Each adds columns only; none changes an existing result.
# [processing.lung_volume]
# require_references = false      # true: an unresolved reference blocks the run
# [processing.lung_volume.ic]
# eelv_tracking = "none"          # "none": the IC is held constant | "within_file": it follows EELV
                                  # (same-file IC reference only; blank with trend correction)
# [processing.mfvl]
# source = "single"               # "single" (largest attempt) | "envelope" of several
# mvv_fev1_multiplier = 40.0      # MVV estimated as FEV1 x this, when no mvv_lpm is given (uses fev1_l)
# [processing.pressure.peepi]
# enabled = true                  # measure intrinsic PEEP and the threshold work of breathing
# [processing.pressure.normalization]
# enabled = true                  # pressure and EMG as a percentage of a typed maximal effort

# --- Repairing the automatic breath detection by hand (flow-bearing analyses) ---
# Times are seconds into the recording. A cut splits a breath in two, a join removes the
# nearest boundary. Preview & QC ▸ Mechanics writes these when you click a trace.
# [[processing.segmentation.overrides]]
# file   = "sample_recording.csv"
# cut_s  = [12.4]
# join_s = [20.1]

# --- EMG-only analyses (analysis.signals = ["emg"], no flow channel) ---
# The recording is cut into segments. "whole_file" (one segment), "separators" (boundaries
# you place, below), "fixed_windows" (equal windows) or "emg_burst" (detected). Only valid
# when the analysis declares EMG only; in that analysis this table replaces the
# [processing.segmentation] table above rather than being added to it.
# [processing.segmentation]
# method = "separators"
# [[processing.segmentation.separators]]
# file    = "sample_recording_emg.csv"
# times_s = [4.3, 7.8, 11.1]      # N separators give N + 1 segments, numbered from 1

[output]
folder = "output"                # workbooks land in <folder>/data
# group_regex = '^(P\d+)'         # first capture group = cohort key; omit → leading filename token

[output.data]
save_average          = true
save_breath_by_breath = true
save_processed        = false   # large per-file processed-signal CSV; off by default

[output.diagnostics]
save_pv_average = true          # averaged Campbell diagram; needs the [plots] extra
save_emg        = true          # per-channel EMG overviews (raw / ECG-removed / noise-reduced)
