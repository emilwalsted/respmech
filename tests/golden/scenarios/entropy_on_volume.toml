# V2_SCENARIOS golden fixture: 'entropy_on_volume'. Sample entropy on the VOLUME column
# (column 6, listed under input.channels.entropy next to the ordinary entropy column 10),
# with drift correction on: entropy is taken on the CONDITIONED volume (zeroed and
# drift-corrected, exactly what the mechanics analyses), not on the raw file column, so
# this scenario pins the coincidence rule. Same flow-only shape and the same committed
# synthetic recordings as 'flow_only'. Baked from the v2 core (golden_newcore.py --write);
# do not hand-edit golden_reference.json's "entropy_on_volume" entry.
schema_version = 2

[analysis]
signals = ["flow"]

[input]
folder = "../input"
files  = "synth_case_*.csv"

[input.format]
sampling_frequency = 1000
decimal            = "."

[input.channels]
flow    = 5
volume  = 6
entropy = [6, 10]   # 6 is the volume column: entropy on the conditioned volume
# poes/pgas/pdi/emg deliberately unset -- this is the flow-only shape.

[processing.segmentation]
method = "flow"
buffer = 200

[processing.segmentation.peak]
height     = 0.1
distance_s = 0.1
width_s    = 0.2

[processing.volume]
integrate_from_flow = false
correct_drift       = true
correct_trend       = false

[processing.wob]
calc_from          = "average"
avg_resampling_obs = 300

[processing.entropy]
# Pinned to match the LEGACY_SCENARIOS' own fixed configuration (make_golden.py's
# base_settings()), not the live GUI default (EntropySettings.epochs = 3 since the
# 05-09-2026 content review) -- this scenario characterises a fixed configuration,
# like every other golden scenario, not "whatever the app currently defaults to".
# Self-review caught this: leaving it unset silently pulled in the GUI default and
# changed every sample_entropy_* column against flow_wob_average's matching columns.
epochs    = 2
tolerance = 0.1

[output]
folder = "output"

[output.data]
save_average          = true
save_breath_by_breath = true
save_processed        = false
