# V2_SCENARIOS golden fixture: 'emg_only_whole_file'. Declares only the 'emg'
# signal -- no flow, no pressure channels -- over a DEDICATED synthetic EMG-only
# recording pair (tests/golden/input/synth_emgonly_*.csv, generated by
# generate_data.py::make_emgonly_file on its own RNG stream; never confused with the
# flow-bearing synth_case_*.csv every other scenario uses). ``processing.segmentation.
# method = "whole_file"`` treats each entire file as one segment. Like flow_only/
# poes_only, this has no legacy-dict shape (analysis.signals/EMG-only segmentation are
# v2-only fields), so it is baked directly from the v2 core (golden_newcore.py
# --write) rather than run through the frozen v1 oracle -- see make_golden.py's
# V2_SCENARIOS/LEGACY_SCENARIOS split and tests/golden/README.md. Do not hand-edit
# golden_reference.json's "emg_only_whole_file" entry; regenerate it with
# golden_newcore.py --write after a deliberate change here (merging ONLY this
# scenario's key onto the committed reference -- see the README's own warning about a
# naive overwrite silently perturbing every other scenario's numbers).
schema_version = 2

[analysis]
signals = ["emg"]

[input]
folder = "../input"
files  = "synth_emgonly_*.csv"

[input.format]
sampling_frequency = 1000
decimal            = "."

[input.channels]
emg = [2, 3, 4]
# flow/volume/poes/pgas/pdi/entropy deliberately unset -- this is the EMG-only shape.

[processing.segmentation]
method = "whole_file"

[processing.emg]
rms_window_s = 0.050

[output]
folder = "output"

[output.data]
save_average          = true
save_breath_by_breath = true
save_processed         = false
